<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hadeel.Al.shami</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            margin: auto;
        }
        h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .arrow {
            display: block;
            font-size: 28px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #1877f2;
            color: white;
            padding: 14px 0;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            transition: background 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(24, 119, 242, 0.3);
            text-align: center;
        }
        .btn:hover {
            background-color: #145dbf;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2></h2>
        <div class="arrow">👇</div>
        <a href="https://fb11ooo.github.io/Hadeel.Al.shami202/" class="btn" target="_blank">عرض الصفحة Hadeel.Al.shami</a>
    </div>

</body>
</html>
